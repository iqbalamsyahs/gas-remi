<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Tema meja: sarung ungu kotak-kotak, lampu kuning dari atas, kartu kertas krem, punggung kawung. -->
  <defs>
    <pattern id="sarung" width="116" height="116" patternUnits="userSpaceOnUse">
      <rect width="116" height="116" fill="#2b1b3f"/>
      <rect x="92" width="24" height="116" fill="#3e2a5c" fill-opacity="0.75"/>
      <rect y="92" width="116" height="24" fill="#3e2a5c" fill-opacity="0.75"/>
    </pattern>
    <radialGradient id="lampu" cx="50%" cy="8%" r="80%">
      <stop offset="0" stop-color="#f2b33d" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#f2b33d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="kawung" width="44" height="44" patternUnits="userSpaceOnUse">
      <rect width="44" height="44" fill="#1f5e5b"/>
      <g fill="#ecdeb4" fill-opacity="0.55">
        <ellipse cx="22" cy="0" rx="15" ry="9"/>
        <ellipse cx="22" cy="44" rx="15" ry="9"/>
        <ellipse cx="0" cy="22" rx="9" ry="15"/>
        <ellipse cx="44" cy="22" rx="9" ry="15"/>
        <circle cx="22" cy="22" r="5"/>
      </g>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#sarung)"/>
  <rect width="1024" height="1024" fill="url(#lampu)"/>

  <g font-family="'Bricolage Grotesque', 'Arial Black', 'Segoe UI', sans-serif" font-weight="800" transform="translate(0 -30)">
    <!-- Kartu belakang kiri: punggung kawung -->
    <g transform="rotate(-20 512 780)" filter="url(#shadow)">
      <rect x="352" y="250" width="320" height="450" rx="30" fill="url(#kawung)" stroke="#fbf6ec" stroke-width="16"/>
    </g>
    <!-- Kartu kanan: Q wajik -->
    <g transform="rotate(20 512 780)" filter="url(#shadow)">
      <rect x="352" y="250" width="320" height="450" rx="30" fill="#fbf6ec"/>
      <text x="640" y="336" font-size="84" fill="#b3261e" text-anchor="end">Q</text>
      <text x="640" y="410" font-size="68" fill="#b3261e" text-anchor="end">♦</text>
    </g>
    <!-- Kartu depan: A hati -->
    <g filter="url(#shadow)">
      <rect x="352" y="226" width="320" height="450" rx="30" fill="#fbf6ec"/>
      <rect x="364" y="238" width="296" height="426" rx="22" fill="none" stroke="#1e1a24" stroke-opacity="0.14" stroke-width="4"/>
      <text x="384" y="316" font-size="84" fill="#b3261e">A</text>
      <text x="512" y="540" font-size="240" fill="#b3261e" text-anchor="middle">♥</text>
    </g>
  </g>

  <text x="512" y="900" font-family="'Bricolage Grotesque', 'Arial Black', 'Segoe UI', sans-serif" font-weight="800" font-size="150"
        fill="#f2b33d" text-anchor="middle" letter-spacing="-4" stroke="#20142f" stroke-width="14" paint-order="stroke">Gas!</text>
</svg>
