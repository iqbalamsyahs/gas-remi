<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="felt" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#1f8a4c"/>
      <stop offset="1" stop-color="#0b4a28"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#felt)"/>
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" transform="translate(0 -40)">
    <g transform="rotate(-22 512 760)" filter="url(#shadow)">
      <rect x="352" y="250" width="320" height="450" rx="32" fill="#fff" stroke="#c9c9c9" stroke-width="6"/>
      <text x="382" y="330" font-size="76" fill="#1a1a1a">K</text>
      <text x="382" y="400" font-size="64" fill="#1a1a1a">♠</text>
    </g>
    <g transform="rotate(22 512 760)" filter="url(#shadow)">
      <rect x="352" y="250" width="320" height="450" rx="32" fill="#fff" stroke="#c9c9c9" stroke-width="6"/>
      <text x="642" y="330" font-size="76" fill="#d62f3a" text-anchor="end">Q</text>
      <text x="642" y="400" font-size="64" fill="#d62f3a" text-anchor="end">♦</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="352" y="230" width="320" height="450" rx="32" fill="#fff" stroke="#c9c9c9" stroke-width="6"/>
      <text x="382" y="312" font-size="76" fill="#d62f3a">A</text>
      <text x="512" y="545" font-size="240" fill="#d62f3a" text-anchor="middle">♥</text>
    </g>
  </g>
  <text x="512" y="870" font-family="'Arial Black', 'Segoe UI', sans-serif" font-weight="900" font-size="120"
        fill="#ffd23f" text-anchor="middle" letter-spacing="6" stroke="#0b4a28" stroke-width="10" paint-order="stroke">GAS!</text>
</svg>
