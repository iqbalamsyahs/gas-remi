<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <!-- Tema meja: sarung ungu kotak-kotak, lampu kuning, tikar hijau, kartu kertas krem, punggung kawung. -->
  <defs>
    <pattern id="sarung" width="58" height="58" patternUnits="userSpaceOnUse">
      <rect width="58" height="58" fill="#2b1b3f"/>
      <rect x="46" width="12" height="58" fill="#3e2a5c" fill-opacity="0.7"/>
      <rect y="46" width="58" height="12" fill="#3e2a5c" fill-opacity="0.7"/>
    </pattern>
    <radialGradient id="lampu" cx="74%" cy="0%" r="75%">
      <stop offset="0" stop-color="#f2b33d" stop-opacity="0.42"/>
      <stop offset="0.65" stop-color="#f2b33d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="kawung" width="30" height="30" patternUnits="userSpaceOnUse">
      <rect width="30" height="30" fill="#1f5e5b"/>
      <g fill="#ecdeb4" fill-opacity="0.55">
        <ellipse cx="15" cy="0" rx="10" ry="6"/>
        <ellipse cx="15" cy="30" rx="10" ry="6"/>
        <ellipse cx="0" cy="15" rx="6" ry="10"/>
        <ellipse cx="30" cy="15" rx="6" ry="10"/>
        <circle cx="15" cy="15" r="3.5"/>
      </g>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="400" fill="url(#sarung)"/>
  <rect width="1200" height="400" fill="url(#lampu)"/>

  <!-- Tikar hijau di bawah kipas kartu -->
  <ellipse cx="900" cy="420" rx="330" ry="120" fill="#1d4f4c"/>
  <ellipse cx="900" cy="420" rx="314" ry="106" fill="none" stroke="#ecdeb4" stroke-opacity="0.3" stroke-width="3" stroke-dasharray="12 9"/>

  <!-- Kipas kartu di kanan -->
  <g font-family="'Bricolage Grotesque', 'Arial Black', 'Segoe UI', sans-serif" font-weight="800">
    <g transform="rotate(-22 900 380)" filter="url(#shadow)">
      <rect x="800" y="90" width="200" height="280" rx="20" fill="url(#kawung)" stroke="#fbf6ec" stroke-width="10"/>
    </g>
    <g transform="rotate(22 900 380)" filter="url(#shadow)">
      <rect x="800" y="90" width="200" height="280" rx="20" fill="#fbf6ec"/>
      <text x="978" y="152" font-size="52" fill="#b3261e" text-anchor="end">Q</text>
      <text x="978" y="200" font-size="42" fill="#b3261e" text-anchor="end">♦</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="800" y="72" width="200" height="280" rx="20" fill="#fbf6ec"/>
      <rect x="808" y="80" width="184" height="264" rx="14" fill="none" stroke="#1e1a24" stroke-opacity="0.14" stroke-width="3"/>
      <text x="822" y="132" font-size="52" fill="#b3261e">A</text>
      <text x="900" y="282" font-size="150" fill="#b3261e" text-anchor="middle">♥</text>
    </g>
  </g>

  <!-- Judul di kiri -->
  <g font-family="'Bricolage Grotesque', 'Arial Black', 'Segoe UI', sans-serif" text-anchor="start">
    <text x="72" y="210" font-size="128" font-weight="800" fill="#f2b33d" letter-spacing="-4"
          stroke="#20142f" stroke-width="10" paint-order="stroke">Gas Remi</text>
    <text x="78" y="266" font-size="32" font-weight="600" fill="#f3ecf9" fill-opacity="0.92">
      Remi Indonesia, main bareng di Discord
    </text>
  </g>
</svg>
