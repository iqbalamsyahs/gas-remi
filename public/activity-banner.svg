<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400">
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f8a4c"/>
      <stop offset="1" stop-color="#0b4a28"/>
    </linearGradient>
    <radialGradient id="glow" cx="75%" cy="45%" r="60%">
      <stop offset="0" stop-color="#ffd23f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Latar meja -->
  <rect width="1200" height="400" fill="url(#felt)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- Pola suit samar -->
  <g font-family="Georgia, serif" fill="#ffffff" fill-opacity="0.06" font-size="90">
    <text x="40" y="120">♠</text>
    <text x="260" y="300">♣</text>
    <text x="520" y="110">♦</text>
    <text x="700" y="330">♥</text>
    <text x="960" y="150">♠</text>
    <text x="1100" y="360">♣</text>
  </g>

  <!-- Kipas kartu di kanan -->
  <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" transform="translate(0 10)">
    <g transform="rotate(-24 900 360)" filter="url(#shadow)">
      <rect x="760" y="110" width="200" height="280" rx="20" fill="#fff" stroke="#c9c9c9" stroke-width="4"/>
      <text x="784" y="172" font-size="50" fill="#1a1a1a">K</text>
      <text x="784" y="226" font-size="44" fill="#1a1a1a">♠</text>
    </g>
    <g transform="rotate(24 900 360)" filter="url(#shadow)">
      <rect x="840" y="110" width="200" height="280" rx="20" fill="#fff" stroke="#c9c9c9" stroke-width="4"/>
      <text x="1016" y="172" font-size="50" fill="#d62f3a" text-anchor="end">Q</text>
      <text x="1016" y="226" font-size="44" fill="#d62f3a" text-anchor="end">♦</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="800" y="90" width="200" height="280" rx="20" fill="#fff" stroke="#c9c9c9" stroke-width="4"/>
      <text x="824" y="152" font-size="50" fill="#d62f3a">A</text>
      <text x="900" y="300" font-size="150" fill="#d62f3a" text-anchor="middle">♥</text>
    </g>
  </g>

  <!-- Judul di kiri -->
  <g font-family="'Arial Black', 'Segoe UI', sans-serif" text-anchor="start">
    <text x="70" y="200" font-size="112" font-weight="900" fill="#ffd23f" letter-spacing="6"
          stroke="#0b4a28" stroke-width="10" paint-order="stroke">GAS REMI</text>
    <text x="74" y="256" font-size="30" font-weight="700" fill="#f8f9fa" fill-opacity="0.9" letter-spacing="3">
      REMI INDONESIA · MAIN BARENG
    </text>
  </g>
  <rect x="74" y="280" width="220" height="6" rx="3" fill="#ffc107"/>
</svg>
